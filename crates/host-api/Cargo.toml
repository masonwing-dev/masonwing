[package]
name = "masonwing-host-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
masonwing-contracts.workspace = true
serde.workspace = true
tokio.workspace = true
thiserror.workspace = true
chrono.workspace = true
sqlx.workspace = true
uuid.workspace = true
serde_json.workspace = true
masonwing-kernel.workspace = true
masonwing-sdk.workspace = true
masonwing-component-runner = { path = "../component-runner" }
masonwing-contract-validation.workspace = true
masonwing-data-postgres.workspace = true
masonwing-identity-oidc = { path = "../../platform-plugins/identity-oidc" }
masonwing-authorization-cedar = { path = "../../platform-plugins/authorization-cedar" }
