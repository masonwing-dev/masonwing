[package]
name = "masonwing-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
masonwing-host-api.workspace = true
masonwing-contracts.workspace = true
masonwing-contract-validation.workspace = true
masonwing-data-postgres.workspace = true
masonwing-kernel.workspace = true
masonwing-workflow-temporal.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
async-trait.workspace = true
axum.workspace = true
temporalio-client = { version = "=1.0.0", optional = true }
temporalio-sdk = { version = "=1.0.0", optional = true }
temporalio-common = { version = "=1.0.0", optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
sqlx.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true

[features]
default = []
local-postgres-tests = []
local-temporal-tests = [
    "dep:temporalio-client",
    "dep:temporalio-sdk",
    "dep:temporalio-common",
    "dep:futures",
    "masonwing-workflow-temporal/local-temporal-tests",
]

[[test]]
name = "crash_resume_postgres"
path = "tests/crash_resume_postgres.rs"
required-features = ["local-postgres-tests"]

