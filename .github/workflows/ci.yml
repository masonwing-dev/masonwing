name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.84.0
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Spec & Schema Drift Checks
        run: |
          python3 scripts/sync_specs.py --check
          node scripts/generate-types.mjs --check

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Rust Cargo Check
        run: cargo check --locked --workspace --jobs 2

      - name: Rust Clippy
        run: cargo clippy --locked --workspace --all-targets --jobs 2 -- -D warnings

      - name: Rust Unit & Domain Tests
        run: cargo test --locked --workspace --jobs 2

      - name: Scaffold Tests
        run: .venv/bin/python -m pytest tests/scaffold -q

      - name: Web Typecheck
        run: pnpm typecheck

      - name: Web Unit Tests
        run: pnpm test

      - name: Web Build
        run: pnpm build
