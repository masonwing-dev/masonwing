global
    log stdout format raw local0 warning
    maxconn 512

defaults
    mode tcp
    log global
    timeout connect 3s
    timeout client 5m
    timeout server 5m
    default-server resolvers docker init-addr none resolve-prefer ipv4 inter 3s fall 3 rise 1

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 1s
    hold refused 1s

listen health
    bind 127.0.0.1:8404
    mode http
    monitor-uri /health

listen web
    bind :39850
    server web web:5173 check

listen api
    bind :39851
    server api api:8080 check

listen postgres
    bind :39852
    server postgres postgres:5432 check

listen keycloak
    bind :39853
    server keycloak keycloak:8080 check

listen temporal-grpc
    bind :39854
    server temporal temporal:7233 check

listen temporal-ui
    bind :39855
    server temporal temporal:8233 check

listen storage-s3
    bind :39856
    server storage storage:9000 check

listen storage-console
    bind :39857
    server storage storage:9001 check

listen openbao
    bind :39858
    server openbao openbao:8200 check

listen provider-fixtures
    bind :39859
    server provider-fixtures provider-fixtures:8080 check
