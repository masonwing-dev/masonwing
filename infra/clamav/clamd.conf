# Local isolated scanner using real signatures bundled with the pinned image.
# Signature version/freshness is recorded in evidence, not a production SLA.
Foreground yes
LogTime yes
LogClean no
PidFile /tmp/clamd.pid
LocalSocket /tmp/clamd.sock
LocalSocketMode 0600
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
ConcurrentDatabaseReload no
MaxThreads 1
MaxQueue 4
ReadTimeout 30
CommandReadTimeout 5
SendBufTimeout 1000
StreamMaxLength 1024M
MaxScanSize 1024M
MaxFileSize 1024M
MaxRecursion 16
MaxFiles 10000
ScanArchive yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanXMLDOCS yes
ScanHWP3 yes
HeuristicAlerts yes
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
